version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (for Airflow metadata)
  # ============================================================================
  postgres-airflow:
    image: postgres:16-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodfact-network

  # ============================================================================
  # Airflow DB Init (runs once, then exits)
  # ============================================================================
  airflow-init:
    image: apache/airflow:2.7.3-python3.11
    container_name: airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    command: db upgrade
    networks:
      - foodfact-network
    restart: "no"

  # ============================================================================
  # Airflow Scheduler
  # ============================================================================
  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.11
    container_name: airflow-scheduler
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
      AIRFLOW__LOGGING__LOG_LEVEL: INFO
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
    ports:
      - "8793:8793"
    command: scheduler
    networks:
      - foodfact-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Airflow Webserver
  # ============================================================================
  airflow-webserver:
    image: apache/airflow:2.7.3-python3.11
    container_name: airflow-webserver
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__EXPOSE_HOSTNAME: 'true'
      AIRFLOW__LOGGING__LOG_LEVEL: INFO
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - foodfact-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # FoodFact Frontend (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend_react
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8090
    container_name: foodfact-frontend
    ports:
      - "3000:3000"
    networks:
      - foodfact-network
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================================
  # FoodFact Backend (Scala)
  # ============================================================================
  backend:
    build:
      context: ./backend_scala
      dockerfile: Dockerfile
    container_name: foodfact-backend
    ports:
      - "8090:8080"
    environment:
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      OFF_TIMEOUT_MS: "10000"
      CACHE_TTL_SECONDS: "300"
      RATE_LIMIT_PER_MINUTE: "30"
    networks:
      - foodfact-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  foodfact-network:
    driver: bridge

volumes:
  postgres-airflow-data:
    driver: local

# ============================================================================
# Frontend:  http://localhost:3000
# Backend:   http://localhost:8090
# Airflow:   http://localhost:8080  (admin / admin)
# ============================================================================
